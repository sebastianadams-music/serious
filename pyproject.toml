[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "serious"
version = "0.1.0"
description = "Computer-aided composition on the command line: pitches in any notation, transformations, set theory, spectra."
readme = "README.md"
license = {text = "Unlicense"}
requires-python = ">=3.10"
dependencies = []

[project.scripts]
serious = "serious.cli:main"

[tool.setuptools]
packages = ["serious"]
